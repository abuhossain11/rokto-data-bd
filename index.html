    <script>
      // Filter out benign Vite HMR WebSocket closing notices in iframe preview
      window.addEventListener('error', function(e) {
        if (e && (e.message?.includes('WebSocket') || e.error?.message?.includes('WebSocket'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason?.message?.includes('WebSocket')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      var _cError = console.error;
      console.error = function() {
        var msg = arguments[0];
        if (typeof msg === 'string' && msg.includes('WebSocket closed without opened')) return;
        if (msg && msg.message && msg.message.includes('WebSocket closed without opened')) return;
        _cError.apply(console, arguments);
      };
    </script>

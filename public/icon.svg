<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7F1D1D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>
  <rect width="512" height="512" rx="112" fill="url(#bloodGrad)" opacity="0.04"/>

  <!-- Main Blood Drop with Drop Shadow -->
  <g filter="url(#shadow)">
    <path d="M256 60 C256 60 110 236 110 336 C110 417 175 480 256 480 C337 480 402 417 402 336 C402 236 256 60 256 60 Z"
          fill="url(#bloodGrad)"/>
    
    <!-- Specular highlight on drop -->
    <path d="M256 86 C256 86 140 238 140 330 C140 365 158 395 185 415 C162 390 148 358 148 322 C148 240 256 110 256 86 Z"
          fill="url(#glowGrad)"/>
  </g>

  <!-- Heart / Cross symbol inside drop -->
  <g fill="#FFFFFF">
    <rect x="236" y="270" width="40" height="110" rx="8" />
    <rect x="201" y="305" width="110" height="40" rx="8" />
  </g>
</svg>
